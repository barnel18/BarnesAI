<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500&display=swap" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0B0D10; color: #E8EAED; font-family: "IBM Plex Sans", Helvetica, Arial, sans-serif; position: relative; }
  .glow { position: absolute; right: -180px; top: -220px; width: 720px; height: 720px; background: radial-gradient(closest-side, rgba(255,106,26,.22), transparent 70%); }
  .wrap { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.01em; }
  .mark { width: 44px; height: 44px; border-radius: 8px; background: #FF6A1A; color: #0B0D10; display: grid; place-items: center; font-size: 28px; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 76px; line-height: 1.02; letter-spacing: -0.025em; margin: 0; max-width: 980px; font-variation-settings: "opsz" 96; }
  .sub { font-size: 26px; color: #9AA4AF; margin-top: 26px; max-width: 900px; line-height: 1.35; }
  .foot { display: flex; justify-content: space-between; font-family: ui-monospace, Menlo, monospace; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: #9AA4AF; }
  .foot b { color: #FF6A1A; font-weight: 500; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="brand"><span class="mark">B</span> Barnes Inc.</div>
    <div>
      <h1>Proof that AI can give small businesses the margins they need.</h1>
      <p class="sub">Built in public, one real project at a time. Least AI necessary.</p>
    </div>
    <div class="foot"><span><b>01</b> / Building in public</span><span>Madison / Milwaukee, WI</span></div>
  </div>
</body>
</html>
